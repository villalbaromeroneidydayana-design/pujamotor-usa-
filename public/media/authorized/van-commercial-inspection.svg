<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg_pm_van" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#141c2c"/>
    </linearGradient>
    <pattern id="grid_pm_van" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg_pm_van)"/>
  <rect width="800" height="500" fill="url(#grid_pm_van)"/>
  
  <!-- Header Badge PUJAMOTOR USA -->
  <rect x="30" y="25" width="460" height="34" rx="6" fill="#0b1b2b" stroke="#00F2FE" stroke-width="1.2"/>
  <circle cx="48" cy="42" r="5" fill="#00F2FE"/>
  <text x="62" y="47" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">PUJAMOTOR USA // FICHA TÉCNICA — VEHÍCULOS COMERCIALES</text>
  
  <!-- Silhouette: Commercial Cargo Van (Ford Transit / Sprinter profile) -->
  <g transform="translate(85, 130)" stroke="#00F2FE" stroke-width="2.5" fill="#080e18" fill-opacity="0.9">
    <!-- Boxy Cargo High Roof Body -->
    <path d="M35,175 L35,120 L95,115 L145,35 L580,35 C605,35 615,50 615,75 L615,175 Z"/>
    
    <!-- Cabin Window and Cargo Divider -->
    <path d="M150,45 L250,45 L250,110 L105,110 Z" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Sliding Cargo Door Panel -->
    <rect x="270" y="45" width="180" height="120" rx="3" fill="#0b1320" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,3"/>
    
    <!-- Heavy-Duty Wheels -->
    <circle cx="150" cy="180" r="44" fill="#06090e" stroke="#00F2FE" stroke-width="3"/>
    <circle cx="150" cy="180" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="140" y="160" width="8" height="20" rx="2" fill="#FF7A00" stroke="none"/>
    <circle cx="150" cy="180" r="12" fill="#00F2FE"/>
    
    <circle cx="505" cy="180" r="44" fill="#06090e" stroke="#00F2FE" stroke-width="3"/>
    <circle cx="505" cy="180" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="495" y="160" width="8" height="20" rx="2" fill="#FF7A00" stroke="none"/>
    <circle cx="505" cy="180" r="12" fill="#00F2FE"/>
  </g>

  <!-- Cargo Volume Callout -->
  <line x1="420" y1="210" x2="470" y2="155" stroke="#FF7A00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="420" cy="210" r="4" fill="#FF7A00"/>
  <rect x="430" y="140" width="165" height="24" rx="4" fill="#1e1810" stroke="#FF7A00" stroke-width="1"/>
  <text x="440" y="156" fill="#FFB775" font-family="monospace" font-size="10" font-weight="bold">ÁREA DE CARGA DE ALTO VOLUMEN</text>

  <!-- Footer Legal Watermark -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#06090e" stroke="#1e293b"/>
  <text x="45" y="460" fill="#94A3B8" font-family="monospace" font-size="11">ORIGEN DE IMAGEN: ACTIVO TÉCNICO AUTORIZADO PUJAMOTOR USA (INSPECCIÓN VISUAL HOMOLOGADA)</text>
</svg>
