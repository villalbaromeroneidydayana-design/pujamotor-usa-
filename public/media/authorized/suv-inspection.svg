<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg_pm_suv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1a24"/>
    </linearGradient>
    <pattern id="grid_pm_suv" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg_pm_suv)"/>
  <rect width="800" height="500" fill="url(#grid_pm_suv)"/>
  
  <!-- Header Badge PUJAMOTOR USA -->
  <rect x="30" y="25" width="410" height="34" rx="6" fill="#0b1b2b" stroke="#00F2FE" stroke-width="1.2"/>
  <circle cx="48" cy="42" r="5" fill="#00F2FE"/>
  <text x="62" y="47" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">PUJAMOTOR USA // FICHA TÉCNICA — CATEGORÍA SUV</text>
  
  <!-- Vehicle Silhouette: SUV -->
  <g transform="translate(100, 145)" stroke="#00F2FE" stroke-width="2.5" fill="#0a121e" fill-opacity="0.85">
    <path d="M45,155 L50,95 L165,85 L235,32 L515,32 L565,95 L585,155 Z"/>
    <path d="M245,44 L350,44 L350,90 L190,90 Z" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M365,44 L498,44 L535,90 L365,90 Z" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Wheels -->
    <circle cx="145" cy="160" r="44" fill="#0b101b" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="145" cy="160" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="135" y="140" width="8" height="18" rx="2" fill="#FF7A00" stroke="none"/>
    <circle cx="145" cy="160" r="12" fill="#00F2FE"/>
    
    <circle cx="480" cy="160" r="44" fill="#0b101b" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="480" cy="160" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="470" y="140" width="8" height="18" rx="2" fill="#FF7A00" stroke="none"/>
    <circle cx="480" cy="160" r="12" fill="#00F2FE"/>
  </g>

  <!-- Inspection Points Callout -->
  <line x1="580" y1="230" x2="650" y2="180" stroke="#FF7A00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="580" cy="230" r="4" fill="#FF7A00"/>
  <rect x="610" y="165" width="150" height="24" rx="4" fill="#1e1810" stroke="#FF7A00" stroke-width="1"/>
  <text x="620" y="181" fill="#FFB775" font-family="monospace" font-size="10" font-weight="bold">INSPECCIÓN POSTERIOR</text>

  <!-- Footer Legal Watermark -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#06090e" stroke="#1e293b"/>
  <text x="45" y="460" fill="#94A3B8" font-family="monospace" font-size="11">ORIGEN DE IMAGEN: ACTIVO TÉCNICO AUTORIZADO PUJAMOTOR USA (INSPECCIÓN VISUAL HOMOLOGADA)</text>
</svg>