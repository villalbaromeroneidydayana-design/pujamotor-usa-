<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg_pm_pickup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <pattern id="grid_pm_pickup" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg_pm_pickup)"/>
  <rect width="800" height="500" fill="url(#grid_pm_pickup)"/>
  
  <!-- Header Badge PUJAMOTOR USA -->
  <rect x="30" y="25" width="410" height="34" rx="6" fill="#0b1b2b" stroke="#00F2FE" stroke-width="1.2"/>
  <circle cx="48" cy="42" r="5" fill="#00F2FE"/>
  <text x="62" y="47" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">PUJAMOTOR USA // FICHA TÉCNICA — PICKUP 4X4</text>
  
  <!-- Vehicle Silhouette: Pickup -->
  <g transform="translate(90, 140)" stroke="#00F2FE" stroke-width="2.5" fill="#0a121e" fill-opacity="0.85">
    <path d="M40,160 L40,105 L160,100 L225,40 L410,40 L415,100 L580,100 L590,160 Z"/>
    <path d="M235,50 L320,50 L320,98 L185,98 Z" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M335,50 L398,50 L402,98 L335,98 Z" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- All-terrain wheels -->
    <circle cx="135" cy="165" r="46" fill="#0b101b" stroke="#38BDF8" stroke-width="3.5"/>
    <circle cx="135" cy="165" r="30" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="125" y="145" width="8" height="20" rx="2" fill="#FF7A00" stroke="none"/>
    <circle cx="135" cy="165" r="14" fill="#00F2FE"/>
    
    <circle cx="495" cy="165" r="46" fill="#0b101b" stroke="#38BDF8" stroke-width="3.5"/>
    <circle cx="495" cy="165" r="30" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="485" y="145" width="8" height="20" rx="2" fill="#FF7A00" stroke="none"/>
    <circle cx="495" cy="165" r="14" fill="#00F2FE"/>
  </g>

  <!-- Inspection Points Callout -->
  <line x1="130" y1="250" x2="75" y2="205" stroke="#FF7A00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="130" cy="250" r="4" fill="#FF7A00"/>
  <rect x="15" y="190" width="140" height="24" rx="4" fill="#1e1810" stroke="#FF7A00" stroke-width="1"/>
  <text x="25" y="206" fill="#FFB775" font-family="monospace" font-size="10" font-weight="bold">SUSPENSIÓN 4X4 OK</text>

  <!-- Footer Legal Watermark -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#06090e" stroke="#1e293b"/>
  <text x="45" y="460" fill="#94A3B8" font-family="monospace" font-size="11">ORIGEN DE IMAGEN: ACTIVO TÉCNICO AUTORIZADO PUJAMOTOR USA (INSPECCIÓN VISUAL HOMOLOGADA)</text>
</svg>