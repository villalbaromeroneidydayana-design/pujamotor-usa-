<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg_pm_sedan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#091422"/>
    </linearGradient>
    <pattern id="grid_pm_sedan" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="2,2"/>
    </pattern>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg_pm_sedan)"/>
  <rect width="800" height="500" fill="url(#grid_pm_sedan)"/>
  
  <!-- Header Badge PUJAMOTOR USA -->
  <rect x="30" y="25" width="430" height="34" rx="6" fill="#0b1b2b" stroke="#00F2FE" stroke-width="1.2"/>
  <circle cx="48" cy="42" r="5" fill="#00F2FE"/>
  <text x="62" y="47" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">PUJAMOTOR USA // FICHA TÉCNICA — AUTOMÓVILES / SEDÁN</text>
  
  <!-- Vehicle Silhouette: Sedan -->
  <g transform="translate(95, 150)" stroke="#00F2FE" stroke-width="2.5" fill="#0a121e" fill-opacity="0.85">
    <path d="M40,145 L55,95 L180,85 L260,38 L445,38 L525,85 L590,95 L595,145 Z"/>
    <path d="M265,48 L355,48 L355,85 L200,85 Z" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M368,48 L438,48 L502,85 L368,85 Z" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Wheels with orange caliper accents -->
    <circle cx="145" cy="150" r="42" fill="#0b101b" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="145" cy="150" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="135" y="130" width="8" height="18" rx="2" fill="#FF7A00" stroke="none"/>
    <circle cx="145" cy="150" r="12" fill="#00F2FE"/>
    
    <circle cx="485" cy="150" r="42" fill="#0b101b" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="485" cy="150" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="475" y="130" width="8" height="18" rx="2" fill="#FF7A00" stroke="none"/>
    <circle cx="485" cy="150" r="12" fill="#00F2FE"/>
  </g>

  <!-- Inspection Points Callout -->
  <line x1="140" y1="230" x2="80" y2="180" stroke="#FF7A00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="140" cy="230" r="4" fill="#FF7A00"/>
  <rect x="15" y="165" width="130" height="24" rx="4" fill="#1e1810" stroke="#FF7A00" stroke-width="1"/>
  <text x="25" y="181" fill="#FFB775" font-family="monospace" font-size="10" font-weight="bold">INSPECCIÓN FRONTAL</text>

  <!-- Footer Legal Watermark -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#06090e" stroke="#1e293b"/>
  <text x="45" y="460" fill="#94A3B8" font-family="monospace" font-size="11">ORIGEN DE IMAGEN: ACTIVO TÉCNICO AUTORIZADO PUJAMOTOR USA (INSPECCIÓN VISUAL HOMOLOGADA)</text>
</svg>