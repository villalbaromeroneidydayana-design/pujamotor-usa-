<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg_pm_ev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040912"/>
      <stop offset="50%" stop-color="#081422"/>
      <stop offset="100%" stop-color="#0c2236"/>
    </linearGradient>
    <pattern id="grid_pm_ev" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#13273d" stroke-width="0.7" stroke-dasharray="2,2"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg_pm_ev)"/>
  <rect width="800" height="500" fill="url(#grid_pm_ev)"/>
  
  <!-- Header Badge PUJAMOTOR USA -->
  <rect x="30" y="25" width="460" height="34" rx="6" fill="#0b1b2b" stroke="#00F2FE" stroke-width="1.2"/>
  <circle cx="48" cy="42" r="5" fill="#00F2FE"/>
  <text x="62" y="47" fill="#E2E8F0" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="1">PUJAMOTOR USA // FICHA TÉCNICA — VEHÍCULOS ELÉCTRICOS (EV)</text>
  
  <!-- Silhouette: Aerodynamic EV (Tesla / Mach-E profile) -->
  <g transform="translate(90, 150)" stroke="#00F2FE" stroke-width="2.5" fill="#07101b" fill-opacity="0.9">
    <!-- EV Fastback Body Line -->
    <path d="M35,145 C45,105 75,90 140,82 C210,65 260,35 390,32 C490,32 540,65 585,88 L615,102 C630,115 630,135 625,145 Z"/>
    
    <!-- Glass Roof Canopy -->
    <path d="M235,42 L390,42 L390,78 L170,78 Z" fill="#0c1d2e" stroke="#38BDF8" stroke-width="1.5"/>
    <path d="M402,42 L510,42 C540,55 560,68 575,78 L402,78 Z" fill="#0c1d2e" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Floor Battery Pack Outline (High Voltage EV pack) -->
    <rect x="210" y="132" width="245" height="14" rx="3" fill="#00F2FE" fill-opacity="0.2" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="4,2"/>
    <text x="245" y="143" fill="#00F2FE" font-family="monospace" font-size="9" font-weight="bold" stroke="none">BATERÍA HV INTEGRADA</text>

    <!-- Aero EV Wheels -->
    <circle cx="150" cy="148" r="42" fill="#06090e" stroke="#00F2FE" stroke-width="3"/>
    <circle cx="150" cy="148" r="28" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="150" cy="148" r="10" fill="#00F2FE"/>
    
    <circle cx="510" cy="148" r="42" fill="#06090e" stroke="#00F2FE" stroke-width="3"/>
    <circle cx="510" cy="148" r="28" fill="#132337" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="510" cy="148" r="10" fill="#00F2FE"/>
  </g>

  <!-- Charge Port Callout -->
  <line x1="680" y1="230" x2="720" y2="175" stroke="#FF7A00" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="680" cy="230" r="4" fill="#FF7A00"/>
  <rect x="655" y="155" width="130" height="24" rx="4" fill="#1e1810" stroke="#FF7A00" stroke-width="1"/>
  <text x="665" y="171" fill="#FFB775" font-family="monospace" font-size="10" font-weight="bold">PUERTO DE CARGA CCS/NACS</text>

  <!-- Footer Legal Watermark -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#06090e" stroke="#1e293b"/>
  <text x="45" y="460" fill="#94A3B8" font-family="monospace" font-size="11">ORIGEN DE IMAGEN: ACTIVO TÉCNICO AUTORIZADO PUJAMOTOR USA (INSPECCIÓN VISUAL HOMOLOGADA)</text>
</svg>
